name: Deploy CDN

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "scripts/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "public/**"
      - "scripts/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-production
  cancel-in-progress: true

env:
  # Pin a commit or tag here for reproducible builds (e.g. @v1.0.0).
  PRETTYINDEX_BASE_URL: https://cdn.jsdelivr.net/gh/borrageiros/PrettyIndex@latest/dist

jobs:
  validate:
    name: Validate assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate public/ folder
        run: node scripts/validate-assets.mjs

      - name: Generate directory listings
        run: node scripts/generate-browse.mjs

  deploy:
    name: Deploy to Cloudflare Pages
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret $name (Settings > Secrets and variables > Actions)"
              missing=1
            fi
          done
          if [ -z "${{ vars.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "::warning::CLOUDFLARE_PAGES_PROJECT not defined; defaulting to 'cdn-borrageiros-com'"
          fi
          echo "Pages project: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cdn-borrageiros-com' }}"
          exit $missing

      - name: Generate directory listings
        run: node scripts/generate-browse.mjs

      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT || 'cdn-borrageiros-com' }} --branch=main
